name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version and changelog on pull request
        if: github.event_name == 'pull_request'
        run: node scripts/verify-release-notes.mjs --base origin/${{ github.base_ref }}

      - name: Verify version and changelog on push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/verify-release-notes.mjs --base ${{ github.event.before }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with 100% coverage
        run: npm run test:coverage
