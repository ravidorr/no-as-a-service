name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.detect.outputs.bumped }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      notes: ${{ steps.detect.outputs.notes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/detect-version-bump.mjs

  release:
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ needs.detect.outputs.notes }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public --provenance
