openapi: 3.1.1
info:
  title: NaaS API
  version: 0.3.0
  description: |
    Every unmatched path and HTTP method returns `200 text/plain` with `No!`.
    Static assets, `GET /health`, and `/api/no` take precedence over that fallback.
    Other requests are rate limited per client IP. Throttled requests return
    `429 text/plain` with `No!`.
paths:
  /health:
    get:
      summary: Return service health and package version
      responses:
        '200':
          description: NaaS health status
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: No!
                  version:
                    type: string
  /api/no:
    get:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    put:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    post:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    delete:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    options:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    head:
      responses:
        '200':
          description: No response body
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    patch:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    trace:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
components:
  responses:
    NoResponse:
      description: NaaS response
      content:
        text/plain:
          schema:
            type: string
            const: No!
    ThrottledResponse:
      description: Rate limit exceeded
      content:
        text/plain:
          schema:
            type: string
            const: No!
x-naas-catch-all:
  description: Every unmatched request path and HTTP method returns `200 text/plain` with `No!` until throttled, then `429 text/plain` with `No!`.
