openapi: 3.1.1
info:
  title: NaaS API
  version: 0.6.0
  description: |
    Every unmatched path and HTTP method returns `200 text/plain` with `No!`.
    Static assets, `GET /version`, `GET /health`, `GET /metrics`, and `/api/no`
    take precedence over that fallback. Non-GET requests to `/version`, `/health`,
    and `/metrics` use the fallback. Other requests are rate limited per client IP.
    Throttled requests return `429 text/plain` with `No!`.
paths:
  /version:
    get:
      summary: Return the package version as plain text
      responses:
        '200':
          description: Package version
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      summary: Return service health and package version
      responses:
        '200':
          description: NaaS health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is draining connections during shutdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: Return Prometheus metrics for scraping
      description: |
        Exposes HTTP service metrics and standard Node.js runtime metrics in
        Prometheus text format. Intended for Prometheus scraping. Exempt from
        rate limiting.
      responses:
        '200':
          description: Prometheus metrics exposition format
          content:
            text/plain:
              schema:
                type: string
  /api/no:
    get:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    put:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    post:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    delete:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    options:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    head:
      responses:
        '200':
          description: No response body
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    patch:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
    trace:
      responses:
        '200':
          $ref: '#/components/responses/NoResponse'
        '429':
          $ref: '#/components/responses/ThrottledResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: No!
        version:
          type: string
  responses:
    NoResponse:
      description: NaaS response
      content:
        text/plain:
          schema:
            type: string
            const: No!
    ThrottledResponse:
      description: Rate limit exceeded
      content:
        text/plain:
          schema:
            type: string
            const: No!
x-naas-catch-all:
  description: Every unmatched request path and HTTP method returns `200 text/plain` with `No!` until throttled, then `429 text/plain` with `No!`.
